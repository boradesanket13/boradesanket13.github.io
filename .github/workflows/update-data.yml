name: Refresh portfolio data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/github.ts"
      - "lib/hashnode.ts"
      - "scripts/fetch-data.ts"
      - "data/header.json"
      - "data/resume.json"

permissions:
  contents: write

concurrency:
  group: refresh-portfolio-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch portfolio data
        env:
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GH_TOKEN }}
        run: npm run fetch:data

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/generated/github.json data/generated/hashnode.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh portfolio data [skip ci]"
            git push
          fi
